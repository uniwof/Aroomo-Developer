name: Executor

# 本机执行员（executor/）单独一个工作流，避免与其他线修改 ci.yml 冲突
on:
  pull_request:
    branches: [dev, main]
    paths: ['executor/**', 'docs/executor-protocol.md', '.github/workflows/executor.yml']
  push:
    branches: [dev]
    paths: ['executor/**', 'docs/executor-protocol.md', '.github/workflows/executor.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executor:
    name: Executor（lint + typecheck + test + build）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: executor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI 冒烟（init / check-url）
        shell: bash
        env:
          AROOMO_EXECUTOR_CONFIG: ${{ runner.temp }}/exec/config.json
        run: |
          node dist/cli.js init
          node dist/cli.js check-url https://example.com/ && exit 1 || echo "空白名单正确拒绝"
