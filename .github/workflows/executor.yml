name: Executor

# 本机执行员（executor/）单独一个工作流，避免与其他线修改 ci.yml 冲突
on:
  pull_request:
    branches: [dev, main]
    paths: ['executor/**', 'core/src/executor/**', 'core/src/auth/**', 'core/src/clients/**', 'shell/src/**', 'docs/executor-protocol.md', '.github/workflows/executor.yml']
  push:
    branches: [dev]
    paths: ['executor/**', 'core/src/executor/**', 'core/src/auth/**', 'core/src/clients/**', 'shell/src/**', 'docs/executor-protocol.md', '.github/workflows/executor.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executor:
    name: Executor（lint + typecheck + test + build）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: executor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI 冒烟（init / check-url）
        shell: bash
        env:
          AROOMO_EXECUTOR_CONFIG: ${{ runner.temp }}/exec/config.json
        run: |
          node dist/cli.js init
          node dist/cli.js check-url https://example.com/ && exit 1 || echo "空白名单正确拒绝"

  e2e-core:
    name: 联调（真实 Core + 执行员，含越权）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
        working-directory: core
      - run: npm ci
        working-directory: executor
      - run: npm run test:e2e
        working-directory: executor

  windows-install:
    name: Executor Windows 安装脚本（PSScriptAnalyzer + 实跑）
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path executor/scripts -Recurse -ExcludeRule PSAvoidUsingWriteHost,PSUseBOMForUnicodeEncodedFile
          $r | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 250
          if (@($r | Where-Object Severity -in 'Error','Warning').Count -gt 0) { exit 1 }
      - name: Pester（安装 / 更新脚本的验收与红线）
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $c = New-PesterConfiguration
          $c.Run.Path = 'executor/test/ps'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: 实跑安装脚本（Windows PowerShell 5.1，不注册自启）
        shell: powershell
        env:
          AROOMO_EXECUTOR_CONFIG: ${{ runner.temp }}\exec\config.json
          AROOMO_EXECUTOR_TOKEN: ci-placeholder-not-a-secret
        run: |
          powershell -ExecutionPolicy Bypass -File executor\scripts\install-windows.ps1 -NoAutostart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\exec\device-token")) { throw '令牌文件没生成' }
          if (-not (Test-Path "$env:RUNNER_TEMP\exec\config.json")) { throw '配置没生成' }
          Remove-Item Env:AROOMO_EXECUTOR_TOKEN
          node executor\dist\cli.js check
          if ($LASTEXITCODE -ne 0) { throw 'check 没通过（令牌文件应可读）' }
      - name: 真 DPAPI 往返 + 凭据文件安装 + 计划任务运行身份（#376 M5 / M7，不得跳过）
        # pwsh（UTF-8）跑这一步的中文；安装脚本本身仍由 Windows PowerShell 5.1 子进程运行（脚本带 BOM）
        shell: pwsh
        env:
          AROOMO_EXECUTOR_CONFIG: ${{ runner.temp }}\exec2\config.json
        run: |
          $cred = Join-Path $env:RUNNER_TEMP 'cred.json'
          $secret = 'ci-dpapi-' + [guid]::NewGuid().ToString('N')
          @{ deviceToken = 'ci-placeholder-device-token'; cfClientId = 'ci-client-id.access'; cfClientSecret = $secret } | ConvertTo-Json | Set-Content -LiteralPath $cred -Encoding UTF8
          $task = 'Aroomo Executor CI ' + $env:GITHUB_RUN_ID
          $dir = Join-Path $env:RUNNER_TEMP 'exec2'
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File executor\scripts\install-windows.ps1 -BootstrapFile $cred -NoAutoUpdate -TaskName $task
          if ($LASTEXITCODE -ne 0) { throw '凭据文件安装失败' }
          try {
            if (Test-Path -LiteralPath $cred) { throw '凭据文件没删' }
            if ((Get-Content -Raw (Join-Path $dir 'cf-access-secret.dpapi')) -match [regex]::Escape($secret)) { throw 'DPAPI 文件里有明文' }
            if ((Get-Content -Raw (Join-Path $dir 'config.json')) -match [regex]::Escape($secret)) { throw 'config.json 里有 Secret' }
            $p = (Get-ScheduledTask -TaskName $task).Principal
            $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
            Write-Output "计划任务运行身份：$($p.UserId) / $($p.LogonType)；当前用户：$me"
            if (($p.UserId -split '\\')[-1] -ne ($me -split '\\')[-1]) { throw '计划任务运行身份不是当前用户' }
            if ($p.UserId -match '^(NT AUTHORITY\\)?SYSTEM$' -or "$($p.LogonType)" -ne 'Interactive') { throw '运行身份或登录类型不对' }
          } finally {
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          }
          $env:AROOMO_REAL_DPAPI = '1'
          $env:AROOMO_REAL_DPAPI_TOKENFILE = Join-Path $dir 'device-token'
          $env:AROOMO_REAL_DPAPI_EXPECT = $secret
          Push-Location executor
          npx vitest run test/cf-access.test.ts --reporter=default --reporter=json --outputFile="$env:RUNNER_TEMP\dpapi.json"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw 'vitest 失败' }
          $r = (Get-Content -Raw "$env:RUNNER_TEMP\dpapi.json" | ConvertFrom-Json).testResults.assertionResults | Where-Object { $_.title -like '真 DPAPI*' }
          if (-not $r -or @($r | Where-Object status -ne 'passed').Count -gt 0) { throw '真 DPAPI 用例没有实跑通过（跳过也算失败）' }
          Write-Output '真 DPAPI 往返：passed'
      - name: 自动更新脚本（检出为游离 HEAD，应安全跳过）
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File executor\scripts\update-windows.ps1 -NoRestart
          if ($LASTEXITCODE -ne 0) { throw '更新脚本应安全退出' }
