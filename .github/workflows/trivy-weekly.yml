name: trivy-weekly
# 每周对 dev 最新代码构建的 core / shell / backup 镜像跑一次 Trivy（#337，负责人审 #333 时的建议）。
# 漏洞库每次现下，所以没人提 PR 也能发现新出的 HIGH/CRITICAL（有修复版本才报）。
# 发现问题：本次运行标红，并开一张工单（已有未关的就在下面追加评论），不重复开单。
# 放行名单与 PR 上的扫描共用 .github/trivyignore.txt；扫描脚本 scripts/ci/trivy-scan.sh（固定版本 + SHA-256 核对）。
on:
  schedule:
    - cron: '17 1 * * 1' # 每周一 01:17 UTC（北京时间 09:17）
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/trivy-weekly.yml
      - scripts/ci/trivy-scan.sh
      - .github/trivyignore.txt
permissions:
  contents: read
jobs:
  scan:
    name: Trivy 每周镜像扫描（core、shell、backup）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - run: docker build --pull -t aroomo-core:weekly core
      - run: docker build --pull -t aroomo-shell:weekly shell
      - run: docker build --pull -t aroomo-backup:weekly deploy/backup
      - name: Trivy 扫描
        id: scan
        run: |
          set -o pipefail
          scripts/ci/trivy-scan.sh aroomo-core:weekly aroomo-shell:weekly aroomo-backup:weekly 2>&1 | tee "$RUNNER_TEMP/trivy.txt"
      - name: 有新漏洞就开单（已有未关的追加评论；PR 上不开单）
        if: failure() && steps.scan.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Trivy 每周扫描：dev 镜像有 HIGH/CRITICAL 漏洞（有修复版本）"
          {
            echo "运行：$RUN_URL（提交 ${GITHUB_SHA::7}）"
            echo
            echo "修法：升级基础镜像 / 依赖；确实不受影响又暂时修不了的写进 .github/trivyignore.txt（带 exp: 到期日和原因）。"
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/trivy.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
