name: adversarial-review
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'needs-leader-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" -o pr.diff
      - name: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/ci/adversarial-review.py
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          body=open("review.md",encoding="utf-8").read()
          req=urllib.request.Request("https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments",
            json.dumps({"body":body}).encode(),{"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Content-Type":"application/json"})
          urllib.request.urlopen(req)
          PY
