# 本机（Windows 本地版）备份：加密后的备份文件存到用户数据文件夹里的 backups 子文件夹，只留最近 3 份（D65）。
# 与 local.yml 一起叠加；.env 里 LOCAL_BACKUP_DIR=<数据文件夹>/backups（正斜杠写法，如 D:/AroomoData/backups）。
# 配置了异地存储（BACKUP_S3_*）时同时上传到 pc/<电脑名>/（安装器写入 BACKUP_S3_PREFIX）；没配置时只在本机，硬盘坏了会一起丢。
services:
  backup:
    environment:
      BACKUP_LOCAL_DIR: /local
      BACKUP_LOCAL_KEEP: ${BACKUP_LOCAL_KEEP:-3}
    volumes:
      - ${LOCAL_BACKUP_DIR:?使用 local-backup.yml 时必须设置 LOCAL_BACKUP_DIR}:/local
  restore:
    environment:
      BACKUP_LOCAL_DIR: /local
    volumes:
      - ${LOCAL_BACKUP_DIR:?使用 local-backup.yml 时必须设置 LOCAL_BACKUP_DIR}:/local
