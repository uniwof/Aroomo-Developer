# 档位：对话演示版（约 2 GB 内存，DECISIONS v4.3：原「精简版」改名）
# ⚠ 暂定值：等 P0-b 内存实测报告后定稿。超出 mem_limit 的容器会被 OOM 杀掉并按 restart 策略重启。
# 包含：postgres、redis、rustfs、litellm、core、lobe。不启用 cloudflared/backup 以外的可选模块。
services:
  postgres: { mem_limit: 384m }
  redis: { mem_limit: 48m }
  rustfs: { mem_limit: 128m }
  litellm: { mem_limit: 512m } # 同时在 .env 保持 LITELLM_NUM_WORKERS=1
  core: { mem_limit: 128m }
  lobe: { mem_limit: 640m }
  cloudflared: { mem_limit: 64m }
  backup: { mem_limit: 128m }
