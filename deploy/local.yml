# 本机 / Windows（WSL2 + Docker Desktop）访问：只绑定 127.0.0.1，不暴露给局域网。
# 服务器不要叠加本文件（服务器经 cloudflared 访问，除 22 外不开端口）。
services:
  lobe:
    ports:
      - '127.0.0.1:${LOBE_PORT:-3210}:3210'
  # 浏览器直接访问对象存储（会话里上传图片需要），与 .env 的 S3_ENDPOINT 对应
  rustfs:
    ports:
      - '127.0.0.1:${RUSTFS_PORT:-9000}:9000'
