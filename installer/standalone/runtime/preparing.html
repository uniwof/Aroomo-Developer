:root {
  color-scheme: light dark;
  --bg: #f5f5f7;
  --fg: #1d1d1f;
  --fg-2: #6e6e73;
  --accent: #ff7f50;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1c1c1e; --fg: #f5f5f7; --fg-2: #a1a1a6; }
}
html, body { height: 100%; margin: 0; }
body {
  display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
  font: 20px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { text-align: center; max-width: 36em; padding: 2em; animation: in 0.5s cubic-bezier(0.25, 0.1, 0.25, 1) both; }
.logo { width: 72px; height: 72px; display: block; margin: 0 auto 20px; animation: breathe 2.4s ease-in-out infinite; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.4em; }
p { color: var(--fg-2); margin: 0 0 1.4em; }
.bar { position: relative; width: 160px; height: 4px; margin: 0 auto; border-radius: 2px; background: rgba(255, 127, 80, 0.22); overflow: hidden; }
.bar span { position: absolute; top: 0; left: 0; width: 40%; height: 100%; border-radius: 2px; background: var(--accent); animation: slide 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 50% { transform: scale(0.94); opacity: 0.85; } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) {
  main, .logo, .bar span { animation: none; }
  .bar span { width: 100%; opacity: 0.6; }
}
</style>

<h1>Aroomo 正在准备</h1>
<p id="msg">后台正在启动，好了会自动打开。第一次启动要准备数据库，可能需要几分钟。</p>
<div class="bar" aria-hidden="true"><span></span></div>
</main>
<script>
  // D77-4：窗口立刻出现，后台就绪后自动跳转（与 p0/standalone 现有逻辑一致）
  var to = new URLSearchParams(location.search).get('to') || 'http://localhost:3280';
  if (!/^http:\/\/(localhost|127\.0\.0\.1):\d+\/?$/.test(to)) to = 'http://localhost:3280';
  var started = Date.now();
  function tick() {
    fetch(to + '/', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { location.replace(to); })
      .catch(function () {
        if (Date.now() - started > 15 * 60 * 1000) {
          document.getElementById('msg').textContent = '后台很久没有启动好。请在开始菜单里运行「Aroomo 修复」。';
        }
        setTimeout(tick, 1500);
      });
  }
  tick();
</script>
